{% load static %}
<!doctype html>
<html lang="ar" dir="rtl" class="scroll-smooth" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>QAM - {% block title %}{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'global/css/main.css' %}">
    {#<link rel="stylesheet" href="{% static 'global/css/build.css' %}">#}
    <script src="https://cdn.jsdelivr.net/npm/theme-change@2.0.2/index.js"></script>
</head>
<body class="bg-base-200/30">
    {% include 'parts/navbar.html' %}
    
    {% block body %}{% endblock body %}
    
    {% include 'parts/footer.html' %}

    <script src="{% static 'global/js/flyonui.js' %}"></script>
    <script src="{% static 'global/js/main.js' %}"></script>
</body>
</html>
