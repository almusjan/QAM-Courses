{% extends 'base.html' %}

{% block title %}إعادة كلمة المرور{% endblock title %}

{% block body %}
	<div class="flex items-start my-14 md:my-10 justify-center min-h-[62vh] md:h-[78vh]">
        <div class="card m-3 w-screen md:w-[48rem]">
            <div class="card-header">
                <div class="card-title text-center">
                    <h2>إعادة كلمة المرور</h2>
                </div>
            </div>
            <hr class="border-0 h-px bg-base-300">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="grid gap-6">
                        {% for field in form %}
                        	<div class="grid gap-1">
                                {{ field.label_tag }}
                                {{ field }}
                            </div>
                        {% endfor %}

                        <div class="card-actions" dir="ltr">
                            <button type="submit" class="btn btn-primary">إرسال</button>
                        </div>
                    </div>
                </form>
            </div>
            <hr class="border-0 h-px bg-base-300 mt-4">
            <div class="card-footer text-lg text-center">
                <a href="{% url 'account:login' %}" class="link link-hover hover:text-primary">
                    <span class="flex items-center gap-1">
                        <span class="icon-[tabler--arrow-right] size-5 mt-1"></span>
                        الرجوع إلى سجل الدخول
                    </span>
                </a>
            </div>
        </div>
    </div>
{% endblock body %}
